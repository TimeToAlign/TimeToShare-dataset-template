# The hooks come from TimeToShare, pinned to one commit: the same one that
# .github/workflows/release.yml names twice (see README.md).
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
repos:
  - repo: https://github.com/TimeToAlign/TimeToShare
    rev: 0cc1c0f15df633b4b797395132111892b09a15f5 # TimeToShare main, pinned; the same commit in .github/workflows/release.yml
    hooks:
      # Validates every staged manifest.
      - id: timetoshare-validate
      # Writes feat or remove! where the staged change adds, edits or removes, and
      # suggests the type of any other change.
      - id: timetoshare-commit-type
      # Refuses a hand-written type that hides an addition, an edit or a removal.
      - id: timetoshare-commit-check
