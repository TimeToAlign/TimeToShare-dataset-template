# Validates every manifest of the repository with the hook pre-commit installs from the
# TimeToShare version .pre-commit-config.yaml pins.
name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Validate
        run: pre-commit run timetoshare-validate --all-files
